# Lint config. Without this file ruff falls back to whatever its current
# default rule set is, which changed in ruff 0.16 (bugbear, bandit, DTZ, RUF...
# are now on by default) and made CI fail on unchanged code.
target-version = "py310"

[lint]
# Keep ruff's defaults, minus rules that fight this codebase on purpose.
ignore = [
    # Broad `except Exception` is deliberate: tkinter callbacks, Genius API
    # calls and JSON persistence must never take down the UI. Failures are
    # logged or surfaced in the status bar at each call site.
    "BLE001",
]

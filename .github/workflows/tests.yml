name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run linter
        run: ruff check lyrix/

      - name: UI import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import lyrix.ui.app, lyrix.ui.controller, lyrix.ui.models, lyrix.ui.state"

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -p pytest_cov --cov=lyrix --cov-report=term-missing --cov-fail-under=100
